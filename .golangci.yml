run:
  timeout: 5m

linters:
  enable:
    - gofmt          # каноническое форматирование
    - goimports      # порядок импортов
    - govet          # printf-несоответствия, unreachable code
    - staticcheck    # комплексный статический анализ (замена golint)
    - errcheck       # все ошибки должны быть проверены
    - ineffassign    # неиспользуемые присваивания
    - gocyclo        # цикломатическая сложность (порог по умолчанию 30)
    - revive         # современная замена golint (стиль, комментарии к экспортируемым идентификаторам)
    - misspell       # опечатки в комментариях/строках